<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function () {
                $('#loginForm').on('submit', function (e) {
                    e.preventDefault();
                    let account = $('#account').val();
                    let passwd = $('#passwd').val();
                    $.ajax({
                        url: '/member/login',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            account:　account,
                            passwd: passwd
                        }),
                        success: function (response) {
                            console.log(response);
                            if (response.success){
                                location.href = "index.html";
                            }else{
                                $('#mesg').text("Login Failure")
                            }
                        },
                        error: function (xhttp, status, error) {
                            console.log(status);
                            console.log(error);
                        }
                    });
                })
            });
        </script>
    </head>
    <body>
        <h1>Login Form</h1>
        <hr />
        <form id="loginForm">
            Account: <input id="account" required /><br />
            Password: <input id="passwd" type="password" required /><br />
            <input type="submit" value="Login" /><br />
            <span id="mesg"></span>
        </form>
    </body>
</html>
