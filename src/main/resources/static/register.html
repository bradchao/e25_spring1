<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
        <h1>Register Form</h1>
        <hr />
        <form id="regForm">
            Account: <input id="account" required /><span id="mesg"></span><br />
            Password: <input id="passwd" type="password" required /><br />
            Name: <input id="name" required /><br />
            <input type="submit" value="Register" /><br />
            <span id="result"></span>
        </form>
        <script>
            let account = document.getElementById("account");
            let passwd = document.getElementById("passwd");
            let name = document.getElementById("name");
            let mesg = document.getElementById("mesg");
            let result = document.getElementById("result");
            let regForm = document.getElementById("regForm");

            account.addEventListener('blur', async () => {
                let url = "/member/exists?account=" + account.value;
                console.log(url);

                let res = await fetch(url);
                console.log(res);
                let isExist = await res.json();
                console.log(isExist);
                mesg.textContent = isExist?"Account EXIST!":"";
            });
            regForm.addEventListener('submit', async(e) =>{
                e.preventDefault();
                let data = {
                  account: account.value,
                  passwd: passwd.value,
                    name: name.value
                };
                let url = "/member/register";
                //---------------------------------
                let res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        "Content-type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
                //------------------------------------
                let json = await res.json();
                console.log(json);
                if (json.success){
                    //result.textContent = "Register success!";
                    location.href = "login.html";
                }else{
                    result.textContent = "Register Failure!";
                }


            });


        </script>
    </body>
</html>
