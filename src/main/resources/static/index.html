<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <style>
            table {border-collapse: collapse; width: 90%; margin: 20px}
            th,td {border: 1px solid #ccc; padding: 8px; text-align: center}
            th {background-color: burlywood}
        </style>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function () {
                // 檢查 Session
                $.ajax({
                    url: "/member/status",
                    method: 'POST',
                    dataType: 'json'
                }).done(function (data) {
                    console.log(data);
                    if (data.success){
                        $('#companyName').text(data.companyName);
                        $('#companyTel').text(data.companyTel);
                        $('#welcome').text("Welcome, " + data.member.name);
                        $('#icon').attr('src', "data:image/png; base64, " + data.member.icon)
                    }else{
                        location.href = "login.html";
                    }

                }).fail(function () {

                })
                //-----------------
                $('#logout').click(function (){
                    $.ajax({
                        url: '/member/logout',
                        method: 'GET',
                        dataType: 'json'
                    }).always(location.href = "login.html");
                })
                //-------------------
                let nowPage = 0;
                let rpp = 10;
                let totalPage = 0;
                let isLast = false;
                function loadGifts(page) {
                    $.ajax({
                        url: `/gifts?page=${page}&rpp=${rpp}`,
                        method: "GET",
                        dataType: "json"
                    }).done(result => {
                        nowPage = result.page;
                        totalPage = result.totalPage;
                        isLast = result.isLast;

                        $('#page').text(`${nowPage + 1} / ${totalPage}`);

                        let tbody = $('#giftTable tbody').empty();
                        result.data.forEach(gift => {
                            tbody.append(
                                `
                                <tr>
                                    <td>${gift.id}</td>
                                    <td>${gift.name}</td>
                                    <td>${gift.addr}</td>
                                    <td>${gift.tel}</td>
                                </tr>
                                `
                            );
                        });

                    })
                }

                $('#prev').click(() => {
                    if (nowPage > 0) loadGifts(nowPage -1);
                });
                $('#next').click(() => {
                    if (!isLast) loadGifts(nowPage + 1);
                });

                loadGifts(nowPage);

            });

        </script>
    </head>
    <body>
        <h1 id="companyName">XXXXXX</h1>
        <h2 id="companyTel">XXXXXX</h2>
        <div id="welcome">Welcome, XXX</div>
        <div><img id="icon" /></div>
        <div><button id="logout">Logout</button></div>
        <hr />
        <button id="prev">Prev</button>
        | <span id="page"></span> |
        <button id="next">Next</button>
        <hr />
        <table id="giftTable">
            <thead>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Tel</th>
            </thead>
            <tbody></tbody>
        </table>
    </body>
</html>
